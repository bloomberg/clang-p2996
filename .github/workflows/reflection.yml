name: Test Reflection in Clang

on:
  push:
    branches: [ "p2996", "ci" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Use 'true' for top-level submodules or 'recursive' for nested submodules
          submodules: true 

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            lld \
            python3 \
            zlib1g-dev \
            git

      - name: Build Clang
        continue-on-error: true
        run: |
          cmake -G "Ninja" -S llvm -B build-llvm -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_ASSERTIONS=ON -DLLVM_UNREACHABLE_OPTIMIZE=ON -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind" -DLLVM_ENABLE_PROJECTS="clang" -DLLVM_FORCE_VC_REPOSITORY=https://github.com/bloomberg/clang-p2996
          ninja cxx -j16 -C build-llvm/

      - name: Test Reflection
        run: |
          cd build-llvm
          bin/llvm-lit -v tools/clang/test/Reflection

